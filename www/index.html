<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re-loader Office Server</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:grid; place-items:center; padding:16px; }
  .card { background:var(--card); border-radius:16px; padding:40px; max-width:560px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  h1 { margin:0 0 8px; font-size:28px; }
  p { color:var(--muted); line-height:1.6; margin:0 0 16px; }
  code { background:#0f172a; padding:2px 8px; border-radius:6px; color:var(--accent); font-size:14px; }
  .ok { display:inline-block; background:#14532d; color:#86efac; padding:4px 12px; border-radius:999px; font-size:13px; margin-bottom:20px; }
</style>
</head>
<body>
  <div class="card">
    <span class="ok">● Online</span>
    <h1>Re-loader Office Server</h1>
    <p>เว็บนี้รันบน Windows Server ในสำนักงาน และเผยแพร่ผ่าน <code>server.re-loader.com</code></p>
    <p>อัปเดตเนื้อหาโดย push ไปที่ GitHub <code>re-loader/LocalBackup</code> โฟลเดอร์ <code>www/</code> เซิร์ฟเวอร์จะดึงลงมาเองภายใน 5 นาที</p>
  </div>
</body>
</html>
